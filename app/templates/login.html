<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP Básico · e-auto — Acceso SII</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <section class="login-wrap">
    <div class="login-card">
      <img class="login-logo" src="https://www.e-auto.global/assets/logos/eauto_logo_new.webp" alt="e-auto">
      <div class="eyebrow">ERP Básico · SII</div>
      <h1>Acceso al SII</h1>
      <p class="sub">Ingresa con el RUT y la Clave Tributaria de tu cuenta del SII.</p>
      <form method="post" action="/login" autocomplete="off">
        <div class="field">
          <label>RUT</label>
          <input name="rut" type="text" placeholder="76.123.456-7" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Clave Tributaria</label>
          <input name="clave" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit">Entrar</button>
        {% if error %}<div class="err">{{ error }}</div>{% else %}<div class="err"></div>{% endif %}
      </form>
      <p class="note">Tus credenciales se usan solo para iniciar sesión en el SII durante esta sesión. No se almacenan.</p>
    </div>
  </section>
</body>
</html>
